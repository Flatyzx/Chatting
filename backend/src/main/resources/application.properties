spring.application.name=chat-backend
server.port=8080

# H2 em arquivo para preservar usuários entre reinicializações locais.
# Para PostgreSQL, substitua URL, usuário, senha e driver por propriedades do ambiente.
spring.datasource.url=jdbc:h2:file:./data/chatdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chave Base64 com pelo menos 256 bits; em produção, forneça via variável de ambiente.
app.jwt.secret=VGhpc0lzQURldmVsb3BtZW50U2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb24=
app.jwt.expiration-ms=86400000

logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
